<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14183a" />
      <stop offset="100%" stop-color="#04050d" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="30%" stop-color="#fcd34d" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with subtle border -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="#fcd34d" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Subtle decorative inner orbit -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#c8b6ff" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.3" />

  <!-- Elegant 'N' Monogram -->
  <path d="M 38 88 L 38 40 L 46 40 L 76 80 L 76 40 L 88 40 L 88 88 L 80 88 L 50 48 L 50 88 Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)" />

  <!-- Brilliant 4-point Sparkle Star at the top right -->
  <g transform="translate(86, 32)">
    <path d="M 0,-14 Q 1,-2 14,0 Q 1,2 0,14 Q -1,2 -14,0 Q -1,-2 0,-14 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Tiny sparkle at bottom left -->
  <g transform="translate(36, 92) scale(0.45)">
    <path d="M 0,-10 Q 1,-1 10,0 Q 1,1 0,10 Q -1,1 -10,0 Q -1,-1 0,-10 Z" fill="#c8b6ff" />
  </g>
</svg>