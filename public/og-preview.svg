<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12163a" />
      <stop offset="60%" stop-color="#070918" />
      <stop offset="100%" stop-color="#03040a" />
    </radialGradient>
    <radialGradient id="glowSpot" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#c8b6ff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#fda4af" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="50%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#glowSpot)" />

  <!-- Delicate framing border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-opacity="0.3" />
  <rect x="52" y="52" width="1096" height="526" rx="18" fill="none" stroke="#c8b6ff" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.2" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="120" r="2" />
    <circle cx="300" cy="200" r="1.5" />
    <circle cx="950" cy="140" r="2.5" />
    <circle cx="1050" cy="280" r="1.8" />
    <circle cx="200" cy="450" r="2.2" />
    <circle cx="850" cy="490" r="1.5" />
    <circle cx="600" cy="110" r="3" />
  </g>

  <!-- Sparkles -->
  <g transform="translate(250, 160) scale(1.2)">
    <path d="M 0,-15 Q 1,-2 15,0 Q 1,2 0,15 Q -1,2 -15,0 Q -1,-2 0,-15 Z" fill="#fcd34d" />
  </g>
  <g transform="translate(980, 420) scale(1)">
    <path d="M 0,-15 Q 1,-2 15,0 Q 1,2 0,15 Q -1,2 -15,0 Q -1,-2 0,-15 Z" fill="#fda4af" />
  </g>

  <!-- Central Badge -->
  <g transform="translate(600, 220)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#1b204a" stroke="#fcd34d" stroke-width="1.5" stroke-opacity="0.5" />
    <text text-anchor="middle" y="7" fill="#fcd34d" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="3">TODAY IS THE DAY ✨</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="320" text-anchor="middle" fill="url(#goldText)" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="700">Happy Birthday, Namrata!</text>

  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="300" letter-spacing="1">Today deserves a little extra magic. ✨</text>

  <!-- Footer signature -->
  <text x="600" y="470" text-anchor="middle" fill="#fda4af" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="22">A little surprise made especially for you ❤️</text>
</svg>
